name: ci

# CI runs every gate that does not need the market data file. The ITCH sample is
# 3.5 GB compressed / 8.25 GB raw, so the full-day parse, the four-way book
# cross-validation over real tapes, and the design study are local-only via
# scripts/regenerate.sh. What CI *can* run is the randomised differential test
# between all four book designs, the invariant checks, the ring stress test and
# the sanitizers -- which is where the real correctness risk lives anyway.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # arm64 runner on purpose: the memory-ordering litmus test is only
    # meaningful on a weakly-ordered machine.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: "-DCMAKE_BUILD_TYPE=Release -DHOTPATH_WERROR=ON"
          - name: tsan
            flags: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DHOTPATH_TSAN=ON -DHOTPATH_WERROR=ON"
          - name: asan-ubsan
            flags: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DHOTPATH_ASAN=ON -DHOTPATH_WERROR=ON"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ matrix.flags }}
      - name: Build
        # -k 0 so a -Werror failure reports every diagnostic in the tree in one
        # run, instead of stopping at the first and hiding the rest behind an
        # error limit. Iterating one warning per push against a compiler you
        # cannot run locally is the slowest possible loop.
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The seeded fuzz targets are part of the suite above and so run in every
      # configuration. This adds a short campaign on top, which matters most in
      # the ASan build: without a sanitizer the parser target mostly proves
      # termination, which is the least interesting of its properties.
      - name: Fuzz campaign
        run: ./build/tests/fuzz_campaign --iterations 20000 --seed ${{ github.run_number }}

  # Linux build. The repo is developed on macOS, and every platform difference
  # sits behind four #ifdefs (docs/PORTING.md) -- which rot silently unless
  # something builds the other side. x86-64 here is also the only place the
  # memory-ordering litmus can be checked against a TSO machine.
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: "-DCMAKE_BUILD_TYPE=Release -DHOTPATH_WERROR=ON"
          - name: asan-ubsan
            flags: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DHOTPATH_ASAN=ON -DHOTPATH_WERROR=ON"
          # Builds core/atomic_ref.hpp's fallback on a toolchain that has the
          # real std::atomic_ref, so the shim cannot rot. Today the macOS jobs
          # take that path anyway -- their libc++ has no atomic_ref, which is
          # what the shim is for -- but they will stop doing so the moment the
          # runner image gains it, and then nothing would compile the fallback.
          - name: atomic-ref-fallback
            flags: "-DCMAKE_BUILD_TYPE=Release -DHOTPATH_WERROR=ON -DCMAKE_CXX_FLAGS=-DHOTPATH_FORCE_ATOMIC_REF_FALLBACK"
          # clang against libstdc++ -- a different pairing from both AppleClang
          # + libc++ and gcc + libstdc++. gcc caught three diagnostics the macOS
          # build could not see (a dead store, a PRIu64 mismatch that is only
          # wrong on LP64, a volatile deprecation); a third front-end is cheap
          # insurance against the next one.
          - name: clang
            flags: "-DCMAKE_BUILD_TYPE=Release -DHOTPATH_WERROR=ON -DCMAKE_CXX_COMPILER=clang++"
    name: linux-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: cmake -S . -B build -G Ninja ${{ matrix.flags }}
      - run: cmake --build build -- -k 0
      - run: ctest --test-dir build --output-on-failure
      - name: Environment (clock resolution differs from macOS by ~40x)
        run: ./build/src/hotpath_env
      - name: Memory ordering on x86-64 TSO
        # On arm64 the relaxed ring reports thousands of violations. On x86 it
        # should report zero -- the claim litmus_ring makes but cannot check on
        # a single machine.
        run: ./build/src/litmus_ring --rounds 10

  # RTL co-simulation. Separate job because Verilator is the repo's only
  # non-C++ dependency and the rest of the build must not require it.
  cosim:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - run: brew install verilator
      - name: SystemVerilog vs C++ ITCH parser
        run: ./scripts/cosim.sh

  litmus:
    # The memory-ordering demonstration. Only asserts that the release/acquire
    # ring is clean -- whether the relaxed variant *reproduces* a violation on a
    # given run is microarchitectural and must not gate CI.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - run: brew install ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHOTPATH_WERROR=ON
      - run: cmake --build build -- -k 0
      - name: Environment report
        run: ./build/src/hotpath_env
      - name: SPSC memory-ordering litmus
        run: ./build/src/litmus_ring --rounds 5
